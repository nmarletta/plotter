# Plotter SD card pen settings
# This file is written automatically by the plotter when you save pen settings.
# You can also copy it manually to the SD card root as: .config.cfg

# ---------------------------------------------------------------------------
# Pen settings  (managed by the plotter's Pen Settings menu)
# ---------------------------------------------------------------------------
penDown=100
penUp=800
overwrite=1
penDelay=25

